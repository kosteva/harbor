# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  txtairag:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.txtairag.rule=Host(`txtairag.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.txtairag.loadbalancer.server.port=8501"
      - "traefik.http.routers.txtairag.entrypoints=websecure"
      - "traefik.http.routers.txtairag.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.txtairag.tls.certresolver=letsencrypt"
      - "traefik.http.routers.txtairag.service=txtairag"

    networks:
      - traefik-public
