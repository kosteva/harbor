# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  mcpforge:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcpforge.rule=Host(`mcpforge.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.mcpforge.loadbalancer.server.port=4444"
      - "traefik.http.routers.mcpforge.entrypoints=websecure"
      - "traefik.http.routers.mcpforge.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.mcpforge.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mcpforge.service=mcpforge"

    networks:
      - traefik-public
