# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  parler:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.parler.rule=Host(`parler.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.parler.loadbalancer.server.port=8000"
      - "traefik.http.routers.parler.entrypoints=websecure"
      - "traefik.http.routers.parler.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it. No tls.domains label: this
      # gets each service its own individual certificate, auto-derived
      # from its own Host() rule (Traefik's default behavior).
      - "traefik.http.routers.parler.tls.certresolver=letsencrypt"
      - "traefik.http.routers.parler.service=parler"

    networks:
      - traefik-public
