# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  comfyui:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comfyui.rule=Host(`comfyui.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.comfyui.loadbalancer.server.port=${HARBOR_COMFYUI_HOST_PORT}"
      - "traefik.http.routers.comfyui.entrypoints=websecure"
      - "traefik.http.routers.comfyui.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver or domains (verified empirically against a
      # live Traefik v3 instance) — once a router has any explicit tls.*
      # field it stops inheriting entrypoint-level TLS defaults entirely.
      # Without the domains labels below, each router would request its
      # own individual cert (auto-derived from its own Host() rule)
      # instead of reusing the shared wildcard.
      - "traefik.http.routers.comfyui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.comfyui.tls.domains[0].main=${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.comfyui.tls.domains[0].sans=*.${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.comfyui.service=comfyui"

    networks:
      - traefik-public
