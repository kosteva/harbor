# This file is generated by seed-cdi.ts script,
# any updates will be overwritten.
services:
  photoprism:
    environment:
      - PHOTOPRISM_INIT=https tensorflow-gpu gpu
      - PHOTOPRISM_FFMPEG_ENCODER=nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities: [gpu]
              device_ids:
              - nvidia.com/gpu=all
