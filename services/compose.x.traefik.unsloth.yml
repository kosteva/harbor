# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  unsloth:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.unsloth.rule=Host(`unsloth.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.unsloth.loadbalancer.server.port=8888"
      - "traefik.http.routers.unsloth.entrypoints=websecure"
      - "traefik.http.routers.unsloth.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.unsloth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.unsloth.service=unsloth"

    networks:
      - traefik-public
