# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  activepieces:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.activepieces.rule=Host(`activepieces.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.activepieces.loadbalancer.server.port=80"
      - "traefik.http.routers.activepieces.entrypoints=websecure"
      - "traefik.http.routers.activepieces.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.activepieces.tls.certresolver=letsencrypt"
      - "traefik.http.routers.activepieces.service=activepieces"

    networks:
      - traefik-public
