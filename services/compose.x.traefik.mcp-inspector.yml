# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  mcp-inspector:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-inspector.rule=Host(`mcp-inspector.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.mcp-inspector.loadbalancer.server.port=6274"
      - "traefik.http.routers.mcp-inspector.entrypoints=websecure"
      - "traefik.http.routers.mcp-inspector.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver or domains (verified empirically against a
      # live Traefik v3 instance) — once a router has any explicit tls.*
      # field it stops inheriting entrypoint-level TLS defaults entirely.
      # Without the domains labels below, each router would request its
      # own individual cert (auto-derived from its own Host() rule)
      # instead of reusing the shared wildcard.
      - "traefik.http.routers.mcp-inspector.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mcp-inspector.tls.domains[0].main=${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.mcp-inspector.tls.domains[0].sans=*.${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.mcp-inspector.service=mcp-inspector"

    networks:
      - traefik-public
