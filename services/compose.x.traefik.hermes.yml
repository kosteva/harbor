# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  hermes:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes.rule=Host(`hermes.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.hermes.loadbalancer.server.port=8642"
      - "traefik.http.routers.hermes.entrypoints=websecure"
      - "traefik.http.routers.hermes.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.hermes.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hermes.service=hermes"

    networks:
      - traefik-public
