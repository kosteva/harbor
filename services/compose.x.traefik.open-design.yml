# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  open-design:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-design.rule=Host(`open-design.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.open-design.loadbalancer.server.port=7456"
      - "traefik.http.routers.open-design.entrypoints=websecure"
      - "traefik.http.routers.open-design.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver or domains (verified empirically against a
      # live Traefik v3 instance) — once a router has any explicit tls.*
      # field it stops inheriting entrypoint-level TLS defaults entirely.
      # Without the domains labels below, each router would request its
      # own individual cert (auto-derived from its own Host() rule)
      # instead of reusing the shared wildcard.
      - "traefik.http.routers.open-design.tls.certresolver=letsencrypt"
      - "traefik.http.routers.open-design.tls.domains[0].main=${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.open-design.tls.domains[0].sans=*.${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.open-design.service=open-design"

    networks:
      - traefik-public
