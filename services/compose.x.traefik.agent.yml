# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  agent:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=Host(`agent.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.agent.loadbalancer.server.port=8000"
      - "traefik.http.routers.agent.entrypoints=websecure"
      - "traefik.http.routers.agent.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.agent.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agent.service=agent"

    networks:
      - traefik-public
