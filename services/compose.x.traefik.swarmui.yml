# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  swarmui:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swarmui.rule=Host(`swarmui.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.swarmui.loadbalancer.server.port=7801"
      - "traefik.http.routers.swarmui.entrypoints=websecure"
      - "traefik.http.routers.swarmui.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.swarmui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.swarmui.service=swarmui"

    networks:
      - traefik-public
