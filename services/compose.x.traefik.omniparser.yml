# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  omniparser:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.omniparser.rule=Host(`omniparser.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.omniparser.loadbalancer.server.port=7861"
      - "traefik.http.routers.omniparser.entrypoints=websecure"
      - "traefik.http.routers.omniparser.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.omniparser.tls.certresolver=letsencrypt"
      - "traefik.http.routers.omniparser.service=omniparser"

    networks:
      - traefik-public
