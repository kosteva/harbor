# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  localai:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.localai.rule=Host(`localai.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.localai.loadbalancer.server.port=8080"
      - "traefik.http.routers.localai.entrypoints=websecure"
      - "traefik.http.routers.localai.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.localai.tls.certresolver=letsencrypt"
      - "traefik.http.routers.localai.service=localai"

    networks:
      - traefik-public
