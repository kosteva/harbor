# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  sillytavern:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sillytavern.rule=Host(`sillytavern.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.sillytavern.loadbalancer.server.port=8000"
      - "traefik.http.routers.sillytavern.entrypoints=websecure"
      - "traefik.http.routers.sillytavern.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.sillytavern.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sillytavern.service=sillytavern"

    networks:
      - traefik-public
