# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  tts:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tts.rule=Host(`tts.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.tts.loadbalancer.server.port=8000"
      - "traefik.http.routers.tts.entrypoints=websecure"
      - "traefik.http.routers.tts.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.tts.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tts.service=tts"

    networks:
      - traefik-public
