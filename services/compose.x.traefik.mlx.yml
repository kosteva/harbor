# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  mlx:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mlx.rule=Host(`mlx.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.mlx.loadbalancer.server.port=8080"
      - "traefik.http.routers.mlx.entrypoints=websecure"
      - "traefik.http.routers.mlx.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.mlx.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mlx.service=mlx"

    networks:
      - traefik-public
