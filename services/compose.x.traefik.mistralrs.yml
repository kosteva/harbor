# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  mistralrs:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mistralrs.rule=Host(`mistralrs.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.mistralrs.loadbalancer.server.port=8021"
      - "traefik.http.routers.mistralrs.entrypoints=websecure"
      - "traefik.http.routers.mistralrs.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.mistralrs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mistralrs.service=mistralrs"

    networks:
      - traefik-public
