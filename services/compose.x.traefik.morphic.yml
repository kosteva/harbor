# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  morphic:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.morphic.rule=Host(`morphic.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.morphic.loadbalancer.server.port=3000"
      - "traefik.http.routers.morphic.entrypoints=websecure"
      - "traefik.http.routers.morphic.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.morphic.tls.certresolver=letsencrypt"
      - "traefik.http.routers.morphic.service=morphic"

    networks:
      - traefik-public
