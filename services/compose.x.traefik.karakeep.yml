# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  karakeep:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.karakeep.rule=Host(`karakeep.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.karakeep.loadbalancer.server.port=3000"
      - "traefik.http.routers.karakeep.entrypoints=websecure"
      - "traefik.http.routers.karakeep.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.karakeep.tls.certresolver=letsencrypt"
      - "traefik.http.routers.karakeep.service=karakeep"

    networks:
      - traefik-public
