# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  chatnio:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatnio.rule=Host(`chatnio.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.chatnio.loadbalancer.server.port=8094"
      - "traefik.http.routers.chatnio.entrypoints=websecure"
      - "traefik.http.routers.chatnio.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.chatnio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.chatnio.service=chatnio"

    networks:
      - traefik-public
