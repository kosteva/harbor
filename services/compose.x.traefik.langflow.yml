# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  langflow:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langflow.rule=Host(`langflow.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.langflow.loadbalancer.server.port=7860"
      - "traefik.http.routers.langflow.entrypoints=websecure"
      - "traefik.http.routers.langflow.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.langflow.tls.certresolver=letsencrypt"
      - "traefik.http.routers.langflow.service=langflow"

    networks:
      - traefik-public
