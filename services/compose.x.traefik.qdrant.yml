# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  qdrant:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"
      - "traefik.http.routers.qdrant.entrypoints=websecure"
      - "traefik.http.routers.qdrant.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.qdrant.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qdrant.service=qdrant"

    networks:
      - traefik-public
