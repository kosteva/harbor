# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  flowise:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flowise.rule=Host(`flowise.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.flowise.loadbalancer.server.port=3000"
      - "traefik.http.routers.flowise.entrypoints=websecure"
      - "traefik.http.routers.flowise.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.flowise.tls.certresolver=letsencrypt"
      - "traefik.http.routers.flowise.service=flowise"

    networks:
      - traefik-public
