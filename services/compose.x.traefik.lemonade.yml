# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  lemonade:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lemonade.rule=Host(`lemonade.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.lemonade.loadbalancer.server.port=13305"
      - "traefik.http.routers.lemonade.entrypoints=websecure"
      - "traefik.http.routers.lemonade.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.lemonade.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lemonade.service=lemonade"

    networks:
      - traefik-public
