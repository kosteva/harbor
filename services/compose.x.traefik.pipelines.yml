# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  pipelines:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pipelines.rule=Host(`pipelines.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.pipelines.loadbalancer.server.port=9099"
      - "traefik.http.routers.pipelines.entrypoints=websecure"
      - "traefik.http.routers.pipelines.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver or domains (verified empirically against a
      # live Traefik v3 instance) — once a router has any explicit tls.*
      # field it stops inheriting entrypoint-level TLS defaults entirely.
      # Without the domains labels below, each router would request its
      # own individual cert (auto-derived from its own Host() rule)
      # instead of reusing the shared wildcard.
      - "traefik.http.routers.pipelines.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pipelines.tls.domains[0].main=${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.pipelines.tls.domains[0].sans=*.${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.pipelines.service=pipelines"

    networks:
      - traefik-public
