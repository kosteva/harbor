# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  mock-openai:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mock-openai.rule=Host(`mock-openai.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.mock-openai.loadbalancer.server.port=-29350}"
      - "traefik.http.routers.mock-openai.entrypoints=websecure"
      - "traefik.http.routers.mock-openai.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver or domains (verified empirically against a
      # live Traefik v3 instance) — once a router has any explicit tls.*
      # field it stops inheriting entrypoint-level TLS defaults entirely.
      # Without the domains labels below, each router would request its
      # own individual cert (auto-derived from its own Host() rule)
      # instead of reusing the shared wildcard.
      - "traefik.http.routers.mock-openai.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mock-openai.tls.domains[0].main=${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.mock-openai.tls.domains[0].sans=*.${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.mock-openai.service=mock-openai"

    networks:
      - traefik-public
