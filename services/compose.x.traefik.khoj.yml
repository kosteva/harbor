# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  khoj:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.khoj.rule=Host(`khoj.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.khoj.loadbalancer.server.port=42110"
      - "traefik.http.routers.khoj.entrypoints=websecure"
      - "traefik.http.routers.khoj.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver or domains (verified empirically against a
      # live Traefik v3 instance) — once a router has any explicit tls.*
      # field it stops inheriting entrypoint-level TLS defaults entirely.
      # Without the domains labels below, each router would request its
      # own individual cert (auto-derived from its own Host() rule)
      # instead of reusing the shared wildcard.
      - "traefik.http.routers.khoj.tls.certresolver=letsencrypt"
      - "traefik.http.routers.khoj.tls.domains[0].main=${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.khoj.tls.domains[0].sans=*.${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.khoj.service=khoj"

    networks:
      - traefik-public
