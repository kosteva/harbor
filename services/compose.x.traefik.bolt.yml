# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  bolt:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bolt.rule=Host(`bolt.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.bolt.loadbalancer.server.port=5173"
      - "traefik.http.routers.bolt.entrypoints=websecure"
      - "traefik.http.routers.bolt.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.bolt.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bolt.service=bolt"

    networks:
      - traefik-public
