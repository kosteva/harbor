# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  marinara:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marinara.rule=Host(`marinara.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.marinara.loadbalancer.server.port=7860"
      - "traefik.http.routers.marinara.entrypoints=websecure"
      - "traefik.http.routers.marinara.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.marinara.tls.certresolver=letsencrypt"
      - "traefik.http.routers.marinara.service=marinara"

    networks:
      - traefik-public
