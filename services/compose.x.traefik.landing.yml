# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  landing:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=Host(`landing.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.landing.loadbalancer.server.port=80"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.landing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing.service=landing"

    networks:
      - traefik-public
