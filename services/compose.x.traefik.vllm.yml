# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  vllm:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vllm.rule=Host(`vllm.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.vllm.loadbalancer.server.port=8000"
      - "traefik.http.routers.vllm.entrypoints=websecure"
      - "traefik.http.routers.vllm.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.vllm.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vllm.service=vllm"

    networks:
      - traefik-public
