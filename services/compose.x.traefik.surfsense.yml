# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  surfsense:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.surfsense.rule=Host(`surfsense.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.surfsense.loadbalancer.server.port=80"
      - "traefik.http.routers.surfsense.entrypoints=websecure"
      - "traefik.http.routers.surfsense.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.surfsense.tls.certresolver=letsencrypt"
      - "traefik.http.routers.surfsense.service=surfsense"

    networks:
      - traefik-public
