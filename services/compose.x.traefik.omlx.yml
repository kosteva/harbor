# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  omlx:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.omlx.rule=Host(`omlx.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.omlx.loadbalancer.server.port=8080"
      - "traefik.http.routers.omlx.entrypoints=websecure"
      - "traefik.http.routers.omlx.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.omlx.tls.certresolver=letsencrypt"
      - "traefik.http.routers.omlx.service=omlx"

    networks:
      - traefik-public
