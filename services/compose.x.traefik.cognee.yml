# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  cognee:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cognee.rule=Host(`cognee.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.cognee.loadbalancer.server.port=8000"
      - "traefik.http.routers.cognee.entrypoints=websecure"
      - "traefik.http.routers.cognee.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.cognee.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cognee.service=cognee"

    networks:
      - traefik-public
