# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  aider:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aider.rule=Host(`aider.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.aider.loadbalancer.server.port=8501"
      - "traefik.http.routers.aider.entrypoints=websecure"
      - "traefik.http.routers.aider.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.aider.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aider.service=aider"

    networks:
      - traefik-public
