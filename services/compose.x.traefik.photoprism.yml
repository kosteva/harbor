# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  photoprism:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.photoprism.rule=Host(`photoprism.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.photoprism.loadbalancer.server.port=2342"
      - "traefik.http.routers.photoprism.entrypoints=websecure"
      - "traefik.http.routers.photoprism.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.photoprism.tls.certresolver=letsencrypt"
      - "traefik.http.routers.photoprism.service=photoprism"

    networks:
      - traefik-public
