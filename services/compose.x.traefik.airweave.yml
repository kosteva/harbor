# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  airweave:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airweave.rule=Host(`airweave.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.airweave.loadbalancer.server.port=8080"
      - "traefik.http.routers.airweave.entrypoints=websecure"
      - "traefik.http.routers.airweave.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.airweave.tls.certresolver=letsencrypt"
      - "traefik.http.routers.airweave.service=airweave"

    networks:
      - traefik-public
