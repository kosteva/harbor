# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  perplexideez:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.perplexideez.rule=Host(`perplexideez.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.perplexideez.loadbalancer.server.port=80"
      - "traefik.http.routers.perplexideez.entrypoints=websecure"
      - "traefik.http.routers.perplexideez.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.perplexideez.tls.certresolver=letsencrypt"
      - "traefik.http.routers.perplexideez.service=perplexideez"

    networks:
      - traefik-public
