# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  langfuse:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langfuse.rule=Host(`langfuse.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.langfuse.loadbalancer.server.port=3000"
      - "traefik.http.routers.langfuse.entrypoints=websecure"
      - "traefik.http.routers.langfuse.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.langfuse.tls.certresolver=letsencrypt"
      - "traefik.http.routers.langfuse.service=langfuse"

    networks:
      - traefik-public
