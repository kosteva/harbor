# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  mindsdb:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mindsdb.rule=Host(`mindsdb.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.mindsdb.loadbalancer.server.port=47334"
      - "traefik.http.routers.mindsdb.entrypoints=websecure"
      - "traefik.http.routers.mindsdb.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.mindsdb.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mindsdb.service=mindsdb"

    networks:
      - traefik-public
