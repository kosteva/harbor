# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  daytona:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.daytona.rule=Host(`daytona.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.daytona.loadbalancer.server.port=3000"
      - "traefik.http.routers.daytona.entrypoints=websecure"
      - "traefik.http.routers.daytona.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.daytona.tls.certresolver=letsencrypt"
      - "traefik.http.routers.daytona.service=daytona"

    networks:
      - traefik-public
