# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  postiz:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postiz.rule=Host(`postiz.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.postiz.loadbalancer.server.port=5000"
      - "traefik.http.routers.postiz.entrypoints=websecure"
      - "traefik.http.routers.postiz.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.postiz.tls.certresolver=letsencrypt"
      - "traefik.http.routers.postiz.service=postiz"

    networks:
      - traefik-public
