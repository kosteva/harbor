services:
  forge:
    container_name: ${HARBOR_CONTAINER_PREFIX}.forge
    build:
      context: ./services/forge
      dockerfile: Dockerfile
      # Forge Neo source, cloned by BuildKit at HARBOR_FORGE_GIT_REF
      additional_contexts:
        forge-src: ${HARBOR_FORGE_GIT_REF}
      args:
        CUDA_VERSION: ${HARBOR_FORGE_CUDA_VERSION}
        TORCH_INDEX: ${HARBOR_FORGE_TORCH_INDEX}
        # The image's user is created with the host IDs so bind-mounted
        # files stay owned by the host user. Rebuild if they change.
        UID: ${HARBOR_USER_ID}
        GID: ${HARBOR_GROUP_ID}
    env_file:
      - ./.env
      - ./services/forge/override.env
    # entrypoint.sh always adds --listen and splits COMMANDLINE_ARGS on whitespace
    environment:
      - COMMANDLINE_ARGS=${HARBOR_FORGE_ARGS}
      - HF_TOKEN=${HARBOR_HF_TOKEN}
    ports:
      - ${HARBOR_FORGE_HOST_PORT}:7860
    volumes:
      - ${HARBOR_FORGE_WORKSPACE}/models:/home/forge/sd-webui/models
      - ${HARBOR_FORGE_WORKSPACE}/output:/home/forge/sd-webui/output
      - ${HARBOR_FORGE_WORKSPACE}/extensions:/home/forge/sd-webui/extensions
      - ${HARBOR_FORGE_WORKSPACE}/config:/home/forge/sd-webui/config
      # pip cache for optional packages installed at launch (--xformers,
      # --sage, ...) and Hugging Face downloads
      - ${HARBOR_FORGE_WORKSPACE}/cache:/home/forge/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    # Docker creates missing bind-mount targets as root:root; the init sidecar
    # pre-creates them owned by the host user before forge starts
    depends_on:
      forge-init:
        condition: service_completed_successfully
    networks:
      - harbor-network

  forge-init:
    container_name: ${HARBOR_CONTAINER_PREFIX}.forge-init
    image: alpine:3.20
    env_file:
      - ./.env
      - ./services/forge/override.env
    environment:
      TARGET_UID: ${HARBOR_USER_ID}
      TARGET_GID: ${HARBOR_GROUP_ID}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./services/forge/workspace-init.sh:/init.sh:ro
      - ${HARBOR_FORGE_WORKSPACE}/models:/mnt/models
      - ${HARBOR_FORGE_WORKSPACE}/output:/mnt/output
      - ${HARBOR_FORGE_WORKSPACE}/extensions:/mnt/extensions
      - ${HARBOR_FORGE_WORKSPACE}/config:/mnt/config
      - ${HARBOR_FORGE_WORKSPACE}/cache:/mnt/cache
    networks:
      - harbor-network
