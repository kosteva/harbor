# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  astrbot:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.astrbot.rule=Host(`astrbot.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.astrbot.loadbalancer.server.port=6185"
      - "traefik.http.routers.astrbot.entrypoints=websecure"
      - "traefik.http.routers.astrbot.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.astrbot.tls.certresolver=letsencrypt"
      - "traefik.http.routers.astrbot.service=astrbot"

    networks:
      - traefik-public
