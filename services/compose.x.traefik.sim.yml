# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  sim:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sim.rule=Host(`sim.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.sim.loadbalancer.server.port=3000"
      - "traefik.http.routers.sim.entrypoints=websecure"
      - "traefik.http.routers.sim.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.sim.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sim.service=sim"

    networks:
      - traefik-public
