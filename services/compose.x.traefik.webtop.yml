# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  webtop:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webtop.rule=Host(`webtop.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.webtop.loadbalancer.server.port=3000"
      - "traefik.http.routers.webtop.entrypoints=websecure"
      - "traefik.http.routers.webtop.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.webtop.tls.certresolver=letsencrypt"
      - "traefik.http.routers.webtop.service=webtop"

    networks:
      - traefik-public
