# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  aphrodite:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aphrodite.rule=Host(`aphrodite.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.aphrodite.loadbalancer.server.port=2242"
      - "traefik.http.routers.aphrodite.entrypoints=websecure"
      - "traefik.http.routers.aphrodite.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.aphrodite.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aphrodite.service=aphrodite"

    networks:
      - traefik-public
