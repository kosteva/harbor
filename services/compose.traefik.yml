services:
  traefik:
    image: ${HARBOR_TRAEFIK_IMAGE}:${HARBOR_TRAEFIK_VERSION}
    container_name: ${HARBOR_CONTAINER_PREFIX}.traefik
    env_file:
      - ./.env
      - ./services/traefik/override.env
    ports:
      - ${HARBOR_TRAEFIK_HOST_PORT}:80
      - ${HARBOR_TRAEFIK_HTTPS_HOST_PORT}:443
      - ${HARBOR_TRAEFIK_METRICS_HOST_PORT}:8082
      - ${HARBOR_TRAEFIK_DASHBOARD_HOST_PORT}:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HARBOR_TRAEFIK_CONFIG}:/etc/traefik/traefik.yml:ro
      - ./services/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./services/traefik/certs:/certs:ro
    networks:
      - traefik-public
    # No traefik.enable label here on purpose: the dashboard is already
    # exposed directly via api.insecure on its own dedicated `traefik`
    # entrypoint (traefik.yml), independent of Docker-provider routing. An
    # enable label with no entrypoints restriction makes the docker
    # provider auto-generate a phantom self-router on every entrypoint
    # including websecure, using an auto-derived, dot-less hostname — noise
    # in the router list but otherwise harmless.

networks:
  traefik-public:
    external: false
