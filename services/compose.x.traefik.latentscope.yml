# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  latentscope:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.latentscope.rule=Host(`latentscope.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.latentscope.loadbalancer.server.port=5001"
      - "traefik.http.routers.latentscope.entrypoints=websecure"
      - "traefik.http.routers.latentscope.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.latentscope.tls.certresolver=letsencrypt"
      - "traefik.http.routers.latentscope.service=latentscope"

    networks:
      - traefik-public
