# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  libretranslate:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.libretranslate.rule=Host(`libretranslate.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.libretranslate.loadbalancer.server.port=5000"
      - "traefik.http.routers.libretranslate.entrypoints=websecure"
      - "traefik.http.routers.libretranslate.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it. No tls.domains label: this
      # gets each service its own individual certificate, auto-derived
      # from its own Host() rule (Traefik's default behavior).
      - "traefik.http.routers.libretranslate.tls.certresolver=letsencrypt"
      - "traefik.http.routers.libretranslate.service=libretranslate"

    networks:
      - traefik-public
