services:
  swarmui:
    build:
      context: ${HARBOR_SWARMUI_GIT_REF}
      dockerfile: launchtools/StandardDockerfile.docker
      args:
        UID: ${HARBOR_USER_ID}
        # BuildKit strips .git from remote-git build contexts by default;
        # SwarmUI's own startup check greps for it and refuses to run
        # ("Improper Download Warning") without a real .git directory.
        BUILDKIT_CONTEXT_KEEP_GIT_DIR: "1"
    # SwarmUI's standard Dockerfile creates a non-root user matching the UID
    # build arg above and runs as that user; cap_drop mirrors upstream's
    # example compose. Rebuild ("harbor build swarmui") on any host whose
    # HARBOR_USER_ID differs from the one baked into an existing image.
    user: "${HARBOR_USER_ID}:${HARBOR_GROUP_ID}"
    cap_drop:
      - ALL
    env_file:
      - ./.env
      - ./services/swarmui/override.env
    container_name: ${HARBOR_CONTAINER_PREFIX}.swarmui
    # SwarmUI reads no environment variables for its own configuration
    # (everything is a CLI arg or Data/Settings.fds); HARBOR_SWARMUI_ARGS
    # is forwarded straight to its entrypoint script. The GIT_CONFIG_* vars
    # below are consumed by git itself, not SwarmUI: the entrypoint
    # overrides $HOME to a path under the dlbackend volume, so the
    # `git config --global --add safe.directory '*'` set at build time
    # (into /root/.gitconfig) isn't visible at runtime — git then refuses
    # to read the repo ("detected dubious ownership") and SwarmUI shows an
    # "Improper Download Warning". Injecting the same config via env
    # survives the $HOME swap.
    environment:
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
    command: ${HARBOR_SWARMUI_ARGS}
    ports:
      - ${HARBOR_SWARMUI_HOST_PORT}:7801
    volumes:
      - ${HARBOR_SWARMUI_WORKSPACE}/data:/SwarmUI/Data
      - ${HARBOR_SWARMUI_WORKSPACE}/dlbackend:/SwarmUI/dlbackend
      - ${HARBOR_SWARMUI_WORKSPACE}/dlnodes:/SwarmUI/src/BuiltinExtensions/ComfyUIBackend/DLNodes
      - ${HARBOR_SWARMUI_WORKSPACE}/extensions:/SwarmUI/src/Extensions
      - ${HARBOR_SWARMUI_MODELS}:/SwarmUI/Models
      - ${HARBOR_SWARMUI_OUTPUT}:/SwarmUI/Output
    # Wait for the init sidecar to chown the bind mounts so the host
    # directories stay owned by the host user — recoverable without `sudo`.
    # Docker creates missing bind-mount targets as root:root by default;
    # SwarmUI's own entrypoint refuses to start ("Detected folder ownership
    # issue") if it finds root-owned dirs while running as a non-root user.
    depends_on:
      swarmui-init:
        condition: service_completed_successfully
    networks:
      - harbor-network

  # Init sidecar: chowns the bind mounts to HARBOR_USER_ID:HARBOR_GROUP_ID
  # before the main container starts. Mirrors the pattern used for comfyui.
  swarmui-init:
    container_name: ${HARBOR_CONTAINER_PREFIX}.swarmui-init
    image: alpine:3.20
    env_file:
      - ./.env
      - ./services/swarmui/override.env
    environment:
      TARGET_UID: ${HARBOR_USER_ID}
      TARGET_GID: ${HARBOR_GROUP_ID}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./services/swarmui/workspace-init.sh:/init.sh:ro
      - ${HARBOR_SWARMUI_WORKSPACE}/data:/mnt/data
      - ${HARBOR_SWARMUI_WORKSPACE}/dlbackend:/mnt/dlbackend
      - ${HARBOR_SWARMUI_WORKSPACE}/dlnodes:/mnt/dlnodes
      - ${HARBOR_SWARMUI_WORKSPACE}/extensions:/mnt/extensions
      - ${HARBOR_SWARMUI_MODELS}:/mnt/models
      - ${HARBOR_SWARMUI_OUTPUT}:/mnt/output
    networks:
      - harbor-network
