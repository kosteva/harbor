# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  nexa:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nexa.rule=Host(`nexa.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.nexa.loadbalancer.server.port=8000"
      - "traefik.http.routers.nexa.entrypoints=websecure"
      - "traefik.http.routers.nexa.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.nexa.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nexa.service=nexa"

    networks:
      - traefik-public
