# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  hollama:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hollama.rule=Host(`hollama.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.hollama.loadbalancer.server.port=4173"
      - "traefik.http.routers.hollama.entrypoints=websecure"
      - "traefik.http.routers.hollama.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.hollama.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hollama.service=hollama"

    networks:
      - traefik-public
