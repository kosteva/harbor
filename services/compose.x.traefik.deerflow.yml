# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  deerflow:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deerflow.rule=Host(`deerflow.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.deerflow.loadbalancer.server.port=3000"
      - "traefik.http.routers.deerflow.entrypoints=websecure"
      - "traefik.http.routers.deerflow.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.deerflow.tls.certresolver=letsencrypt"
      - "traefik.http.routers.deerflow.service=deerflow"

    networks:
      - traefik-public
