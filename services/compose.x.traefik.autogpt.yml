# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  autogpt:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.autogpt.rule=Host(`autogpt.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.autogpt.loadbalancer.server.port=8000"
      - "traefik.http.routers.autogpt.entrypoints=websecure"
      - "traefik.http.routers.autogpt.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.autogpt.tls.certresolver=letsencrypt"
      - "traefik.http.routers.autogpt.service=autogpt"

    networks:
      - traefik-public
