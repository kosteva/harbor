# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  resume-matcher:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resume-matcher.rule=Host(`resume-matcher.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.resume-matcher.loadbalancer.server.port=3000"
      - "traefik.http.routers.resume-matcher.entrypoints=websecure"
      - "traefik.http.routers.resume-matcher.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver or domains (verified empirically against a
      # live Traefik v3 instance) — once a router has any explicit tls.*
      # field it stops inheriting entrypoint-level TLS defaults entirely.
      # Without the domains labels below, each router would request its
      # own individual cert (auto-derived from its own Host() rule)
      # instead of reusing the shared wildcard.
      - "traefik.http.routers.resume-matcher.tls.certresolver=letsencrypt"
      - "traefik.http.routers.resume-matcher.tls.domains[0].main=${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.resume-matcher.tls.domains[0].sans=*.${HARBOR_TRAEFIK_DOMAIN}"
      - "traefik.http.routers.resume-matcher.service=resume-matcher"

    networks:
      - traefik-public
