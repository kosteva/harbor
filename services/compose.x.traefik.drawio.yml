# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  drawio:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.drawio.rule=Host(`drawio.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.drawio.loadbalancer.server.port=3000"
      - "traefik.http.routers.drawio.entrypoints=websecure"
      - "traefik.http.routers.drawio.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.drawio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.drawio.service=drawio"

    networks:
      - traefik-public
