# NOT MOUNTED / NOT READ BY THE CONTAINER. Kept only as a readable reference
# for what services/compose.traefik.yml's `environment:` block expresses —
# that env block is the actual, live source of truth.
#
# Why: Traefik stops accepting brand-new top-level static-config sections
# from environment variables the moment ANY file is mounted at
# /etc/traefik/traefik.yml, regardless of the file's content (verified
# empirically). Since the domain used for the DNS-01 wildcard cert
# (entryPoints.websecure.http.tls.domains) is genuinely per-user and this
# file can't do ${VAR} interpolation anyway (bind-mounted raw, no envsubst),
# keeping a file mounted here at all would permanently break that config —
# so nothing mounts this file.
api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
  traefik:
    address: ":8080"
  metrics:
    address: ":8082"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: harbor_traefik-public

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /acme.json
      dnsChallenge:
        provider: desec
