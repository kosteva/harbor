api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
  traefik:
    address: ":8080"
  metrics:
    address: ":8082"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: harbor_traefik-public

# Let's Encrypt (DNS-01 / deSEC). Domain/email are genuinely per-user, so
# those stay in compose.traefik.yml's `environment:` (this file can't do
# ${VAR} interpolation — bind-mounted raw, no envsubst) and get merged in by
# Traefik at runtime alongside this static block.
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /acme.json
      dnsChallenge:
        provider: desec
