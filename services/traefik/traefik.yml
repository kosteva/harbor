api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  traefik:
    address: ":8080"
  metrics:
    address: ":8082"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: harbor_traefik-public

# Let's Encrypt (DNS-01 / deSEC). One cert per service (no wildcard): each
# router carries its own tls.certresolver=letsencrypt label
# (.scripts/seed-traefik.ts) — a router's tls=true alone does not activate
# ACME on its own, verified empirically against a live Traefik v3 instance.
#
# The email below can't be a Harbor config var — this file is bind-mounted
# raw, no envsubst step exists for it. Edit it directly if you want ACME
# expiry notices sent somewhere other than the placeholder address.
certificatesResolvers:
  letsencrypt:
    acme:
      email: "harbor@harbor.sh"
      storage: /acme.json
      dnsChallenge:
        provider: desec
