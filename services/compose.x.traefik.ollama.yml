# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  ollama:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"
      - "traefik.http.routers.ollama.entrypoints=websecure"
      - "traefik.http.routers.ollama.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.ollama.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ollama.service=ollama"

    networks:
      - traefik-public
