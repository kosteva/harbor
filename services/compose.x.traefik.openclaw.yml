# This file is generated by seed-traefik.ts script,
# any updates will be overwritten.
services:
  openclaw:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openclaw.rule=Host(`openclaw.${HARBOR_TRAEFIK_DOMAIN}`)"
      - "traefik.http.services.openclaw.loadbalancer.server.port=${HARBOR_OPENCLAW_HOST_PORT}"
      - "traefik.http.routers.openclaw.entrypoints=websecure"
      - "traefik.http.routers.openclaw.tls=true"
      # A router's tls=true does NOT inherit the websecure entrypoint's
      # default certResolver (verified empirically against a live Traefik
      # v3 instance) — each router needs its own explicit certresolver
      # label or ACME never activates for it.
      - "traefik.http.routers.openclaw.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openclaw.service=openclaw"

    networks:
      - traefik-public
